name: Modern Animal
description: 'Modern Animal is a membership-based veterinary healthcare company operating
  physical primary and urgent care clinics across major U.S. metropolitan regions,
  combining in-clinic visits with 24/7 virtual veterinary consultations, pharmacy
  and prescription management, dental care, surgery, and preventive care. It runs a
  subscription membership model (All Access, Essential, and Pay As You Go tiers) with
  transparent, upfront pricing and a companion mobile app for booking and virtual
  care. The company was surfaced as a portfolio company of dcm-ventures and susa-ventures.
  Modern Animal is a consumer veterinary brand and publishes no public developer API,
  documentation, or SDK surface as of this enrichment pass.'
